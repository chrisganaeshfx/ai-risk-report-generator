services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

  ingestion-service:
    build: ./ingestion-service
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - mongo
      - server
    volumes:
      - ./ingestion-service:/app

  rag-service:
    build: ./rag-service
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      - mongo
      - server
    volumes:
      - ./rag-service:/app

  speech-ocr-service:
    build: ./speech-ocr-service
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./speech-ocr-service:/app

volumes:
  mongo-data:
