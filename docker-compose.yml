services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      # Overrides the localhost defaults from .env — inside this container,
      # the other services are reachable by Docker service name, not
      # localhost. See CLAUDE.md "Known pitfalls".
      INGESTION_SERVICE_URL: http://ingestion-service:8001
      RAG_SERVICE_URL: http://rag-service:8002
      SPEECH_OCR_SERVICE_URL: http://speech-ocr-service:8003
    depends_on:
      - mongo
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

  ingestion-service:
    build: ./ingestion-service
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      - mongo
      - server
    volumes:
      - ./ingestion-service:/app

  rag-service:
    build: ./rag-service
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      - mongo
      - server
    volumes:
      - ./rag-service:/app

  speech-ocr-service:
    build: ./speech-ocr-service
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - server
    volumes:
      - ./speech-ocr-service:/app

volumes:
  mongo-data:
