name: Tests
description: Run tests for client and server. Microservice test will be added once it is implemented.

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test -- --run

  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    # config.ts validates env at import time, so importing `app` in a test
    # throws without these. Dummy values only — nothing here connects out.
    env:
      MONGODB_URI: mongodb://localhost:27017/a2603-test
      JWT_SECRET: ci-test-secret-not-used-anywhere-real
      INGESTION_SERVICE_URL: http://localhost:8001
      RAG_SERVICE_URL: http://localhost:8002
      SPEECH_OCR_SERVICE_URL: http://localhost:8003

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test -- --run
